<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-label="Worker unloading packages from a delivery van">
  <rect width="600" height="440" rx="28" fill="#fef2f2"/>

  <!-- ground -->
  <rect x="0" y="368" width="600" height="72" fill="#f3d9d9" opacity="0.6"/>
  <ellipse cx="300" cy="372" rx="260" ry="14" fill="#e6c3c3" opacity="0.5"/>

  <!-- van, back doors open -->
  <g>
    <!-- open door (left) -->
    <rect x="70" y="150" width="16" height="170" rx="4" fill="#b80410"/>
    <rect x="55" y="150" width="16" height="170" rx="4" fill="#d40511" transform="rotate(-8 70 150)"/>
    <!-- open door (right, folded back) -->
    <rect x="250" y="150" width="16" height="170" rx="4" fill="#b80410"/>

    <!-- van body -->
    <rect x="86" y="150" width="164" height="170" fill="#d40511"/>
    <rect x="86" y="150" width="164" height="20" fill="#ffcc00"/>
    <!-- interior shading to suggest open cargo hold -->
    <rect x="100" y="185" width="136" height="120" fill="#7a0309"/>
    <!-- a box still inside -->
    <rect x="112" y="245" width="55" height="50" rx="4" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <line x1="112" y1="270" x2="167" y2="270" stroke="#111827" stroke-width="2"/>

    <!-- cab, front of van -->
    <path d="M250 165 h60 a20 20 0 0 1 20 20 v75 a10 10 0 0 1 -10 10 h-70 Z" fill="#111827"/>
    <path d="M262 178 h34 a12 12 0 0 1 12 12 v22 h-46 Z" fill="#bfe3ff" opacity="0.85"/>
    <rect x="250" y="230" width="80" height="10" fill="#ffcc00"/>

    <!-- chassis + wheels -->
    <rect x="86" y="312" width="264" height="16" rx="4" fill="#1f2937"/>
    <circle cx="140" cy="336" r="26" fill="#111827"/>
    <circle cx="140" cy="336" r="11" fill="#9ca3af"/>
    <circle cx="310" cy="336" r="26" fill="#111827"/>
    <circle cx="310" cy="336" r="11" fill="#9ca3af"/>
  </g>

  <!-- worker carrying a box away from the van -->
  <g>
    <rect x="395" y="330" width="20" height="48" rx="8" fill="#111827"/>
    <rect x="428" y="330" width="20" height="48" rx="8" fill="#111827"/>
    <rect x="390" y="376" width="30" height="12" rx="6" fill="#374151"/>
    <rect x="423" y="376" width="30" height="12" rx="6" fill="#374151"/>
    <rect x="386" y="250" width="72" height="88" rx="16" fill="#ffcc00"/>
    <path d="M398 250 L422 338" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
    <path d="M446 250 L422 338" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
    <rect x="410" y="230" width="24" height="22" rx="8" fill="#c98a5e"/>
    <circle cx="422" cy="210" r="25" fill="#e3a679"/>
    <path d="M397 204 A25 21 0 0 1 447 204 L447 198 A25 19 0 0 0 397 198 Z" fill="#111827"/>
    <rect x="395" y="196" width="54" height="11" rx="5" fill="#111827"/>
    <!-- arms cradling box -->
    <rect x="358" y="266" width="24" height="64" rx="11" fill="#eab676"/>
    <rect x="462" y="266" width="24" height="64" rx="11" fill="#eab676"/>
    <!-- carried box -->
    <rect x="368" y="292" width="108" height="64" rx="6" fill="#ffffff" stroke="#111827" stroke-width="3"/>
    <line x1="368" y1="324" x2="476" y2="324" stroke="#111827" stroke-width="2.5"/>
    <line x1="422" y1="292" x2="422" y2="356" stroke="#111827" stroke-width="2.5"/>
  </g>

  <!-- hand dolly with a couple of boxes, waiting -->
  <g>
    <rect x="500" y="290" width="46" height="46" rx="4" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <rect x="504" y="252" width="38" height="38" rx="4" fill="#ffcc00" stroke="#111827" stroke-width="2.5"/>
    <rect x="492" y="336" width="66" height="8" fill="#374151"/>
    <circle cx="500" cy="352" r="9" fill="#111827"/>
    <circle cx="548" cy="352" r="9" fill="#111827"/>
    <line x1="492" y1="336" x2="492" y2="280" stroke="#374151" stroke-width="5"/>
  </g>
</svg>
