<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-label="Courier handing a package to a customer at their front door">
  <rect width="600" height="440" rx="28" fill="#fef2f2"/>

  <!-- ground -->
  <rect x="0" y="368" width="600" height="72" fill="#f3d9d9" opacity="0.6"/>

  <!-- house facade -->
  <g>
    <rect x="330" y="120" width="230" height="250" fill="#ffffff"/>
    <polygon points="330,120 445,60 560,120" fill="#111827"/>
    <rect x="330" y="112" width="230" height="12" fill="#d40511"/>
    <!-- window -->
    <rect x="480" y="160" width="60" height="60" rx="4" fill="#bfe3ff" stroke="#111827" stroke-width="3"/>
    <line x1="510" y1="160" x2="510" y2="220" stroke="#111827" stroke-width="3"/>
    <line x1="480" y1="190" x2="540" y2="190" stroke="#111827" stroke-width="3"/>
    <!-- porch light -->
    <circle cx="360" cy="170" r="9" fill="#ffcc00"/>
    <line x1="360" y1="160" x2="360" y2="150" stroke="#6b7280" stroke-width="3"/>
    <!-- doorway -->
    <rect x="382" y="190" width="80" height="150" rx="4" fill="#f3f4f6" stroke="#111827" stroke-width="3"/>
    <!-- door mat -->
    <rect x="378" y="342" width="88" height="14" rx="4" fill="#9ca3af"/>
  </g>

  <!-- resident in doorway -->
  <g>
    <rect x="405" y="290" width="18" height="45" rx="7" fill="#374151"/>
    <rect x="433" y="290" width="18" height="45" rx="7" fill="#374151"/>
    <rect x="398" y="235" width="60" height="65" rx="16" fill="#2563eb"/>
    <rect x="410" y="215" width="20" height="20" rx="7" fill="#e3a679"/>
    <circle cx="429" cy="200" r="22" fill="#e3a679"/>
    <path d="M408 196 A21 18 0 0 1 450 196 L450 190 A21 16 0 0 0 408 190 Z" fill="#5b3a29"/>
    <rect x="440" y="245" width="20" height="45" rx="9" fill="#e3a679"/>
  </g>

  <!-- courier handing over a package -->
  <g>
    <rect x="205" y="330" width="20" height="50" rx="8" fill="#111827"/>
    <rect x="238" y="330" width="20" height="50" rx="8" fill="#111827"/>
    <rect x="200" y="378" width="30" height="12" rx="6" fill="#374151"/>
    <rect x="233" y="378" width="30" height="12" rx="6" fill="#374151"/>
    <rect x="196" y="248" width="72" height="88" rx="16" fill="#d40511"/>
    <rect x="196" y="248" width="72" height="16" rx="8" fill="#ffcc00"/>
    <rect x="222" y="228" width="22" height="22" rx="8" fill="#c98a5e"/>
    <circle cx="233" cy="208" r="24" fill="#e3a679"/>
    <path d="M209 202 A24 20 0 0 1 257 202 L257 196 A24 18 0 0 0 209 196 Z" fill="#111827"/>
    <rect x="207" y="194" width="52" height="10" rx="5" fill="#111827"/>
    <!-- extended arm holding box out -->
    <rect x="255" y="268" width="60" height="20" rx="10" fill="#eab676"/>
  </g>

  <!-- handed-over box, between courier and resident -->
  <g>
    <rect x="300" y="255" width="70" height="60" rx="6" fill="#ffffff" stroke="#111827" stroke-width="3"/>
    <line x1="300" y1="285" x2="370" y2="285" stroke="#111827" stroke-width="2.5"/>
    <line x1="335" y1="255" x2="335" y2="315" stroke="#111827" stroke-width="2.5"/>
    <rect x="322" y="248" width="26" height="14" rx="3" fill="#ffcc00"/>
  </g>
</svg>
