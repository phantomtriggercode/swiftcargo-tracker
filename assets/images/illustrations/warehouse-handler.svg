<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" role="img" aria-label="Warehouse worker handling packages">
  <rect width="600" height="440" rx="28" fill="#fef2f2"/>

  <!-- background shelving -->
  <g opacity="0.5">
    <g stroke="#d1d5db" stroke-width="4" fill="none">
      <rect x="30" y="90" width="110" height="230"/>
      <line x1="30" y1="150" x2="140" y2="150"/>
      <line x1="30" y1="210" x2="140" y2="210"/>
      <line x1="30" y1="270" x2="140" y2="270"/>
    </g>
    <g fill="#e5e7eb">
      <rect x="42" y="100" width="34" height="26" rx="3"/>
      <rect x="86" y="102" width="30" height="24" rx="3"/>
      <rect x="42" y="160" width="34" height="26" rx="3"/>
      <rect x="88" y="220" width="30" height="26" rx="3"/>
    </g>
    <g stroke="#d1d5db" stroke-width="4" fill="none">
      <rect x="460" y="90" width="110" height="230"/>
      <line x1="460" y1="150" x2="570" y2="150"/>
      <line x1="460" y1="210" x2="570" y2="210"/>
      <line x1="460" y1="270" x2="570" y2="270"/>
    </g>
    <g fill="#e5e7eb">
      <rect x="472" y="102" width="34" height="24" rx="3"/>
      <rect x="516" y="160" width="34" height="26" rx="3"/>
      <rect x="472" y="222" width="34" height="24" rx="3"/>
    </g>
  </g>

  <!-- floor -->
  <rect x="0" y="368" width="600" height="72" fill="#f3d9d9" opacity="0.6"/>
  <ellipse cx="300" cy="372" rx="230" ry="14" fill="#e6c3c3" opacity="0.5"/>

  <!-- box stack, left of worker -->
  <g>
    <rect x="160" y="260" width="70" height="60" rx="4" fill="#ffcc00" stroke="#111827" stroke-width="2.5"/>
    <line x1="160" y1="290" x2="230" y2="290" stroke="#111827" stroke-width="2"/>
    <line x1="195" y1="260" x2="195" y2="320" stroke="#111827" stroke-width="2"/>
    <rect x="170" y="200" width="55" height="55" rx="4" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <line x1="170" y1="227" x2="225" y2="227" stroke="#111827" stroke-width="2"/>
    <line x1="197" y1="200" x2="197" y2="255" stroke="#111827" stroke-width="2"/>
  </g>

  <!-- worker carrying a box -->
  <g>
    <!-- legs -->
    <rect x="315" y="330" width="22" height="55" rx="8" fill="#111827"/>
    <rect x="350" y="330" width="22" height="55" rx="8" fill="#111827"/>
    <!-- shoes -->
    <rect x="310" y="378" width="34" height="14" rx="6" fill="#374151"/>
    <rect x="345" y="378" width="34" height="14" rx="6" fill="#374151"/>
    <!-- torso: safety vest -->
    <rect x="308" y="255" width="78" height="90" rx="16" fill="#ffcc00"/>
    <path d="M320 255 L347 345" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <path d="M374 255 L347 345" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
    <!-- neck + head -->
    <rect x="335" y="235" width="24" height="22" rx="8" fill="#c98a5e"/>
    <circle cx="347" cy="215" r="26" fill="#e3a679"/>
    <!-- cap -->
    <path d="M319 208 A28 24 0 0 1 375 208 L375 202 A28 22 0 0 0 319 202 Z" fill="#111827"/>
    <rect x="317" y="200" width="60" height="12" rx="6" fill="#111827"/>
    <!-- arms holding a box -->
    <rect x="278" y="270" width="26" height="70" rx="12" fill="#eab676"/>
    <rect x="388" y="270" width="26" height="70" rx="12" fill="#eab676"/>
    <!-- held box -->
    <rect x="290" y="300" width="120" height="70" rx="6" fill="#ffffff" stroke="#111827" stroke-width="3"/>
    <line x1="290" y1="335" x2="410" y2="335" stroke="#111827" stroke-width="2.5"/>
    <line x1="350" y1="300" x2="350" y2="370" stroke="#111827" stroke-width="2.5"/>
  </g>

  <!-- forklift silhouette, far background -->
  <g opacity="0.35" fill="#9ca3af">
    <rect x="440" y="330" width="80" height="34" rx="4"/>
    <rect x="512" y="300" width="8" height="64"/>
    <rect x="512" y="296" width="20" height="8"/>
    <circle cx="458" cy="368" r="12"/>
    <circle cx="502" cy="368" r="12"/>
  </g>
</svg>
